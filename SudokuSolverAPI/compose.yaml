services:
  api:
    image: ghcr.io/sd-ufcg-2026/sudoku-solver-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    networks:
      - sudoku-network

  mongo:
    image: mongo
    container_name: mongodb
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
      - ./Seeds/init-sudoku.js:/docker-entrypoint-initdb.d/init-sudoku.js
    networks:
      - sudoku-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-local
    ports:
      - "8081:8081"
    env_file: .env
    networks:
      - sudoku-network

networks:
  sudoku-network:
    external: true